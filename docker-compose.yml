name: glotta

# Dev local UNIQUEMENT (voir DEPLOYMENT.md — Postgres/Redis managés en
# production, jamais ce fichier). Ports liés à 127.0.0.1 et Redis protégé
# par mot de passe (audit de sécurité) : avant ce correctif, les deux
# étaient publiés sur toutes les interfaces sans authentification pour
# Redis, joignables depuis n'importe où sur le réseau local/le même hôte
# partagé. 127.0.0.1 préserve l'accès depuis le poste de dev (backend lancé
# hors Docker) tout en fermant l'exposition réseau.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glotta
      POSTGRES_PASSWORD: glotta
      POSTGRES_DB: glotta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - glotta_postgres_data:/var/lib/postgresql/data
    networks:
      - glotta_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glotta -d glotta"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Utilisé à partir de la phase "files d'attente de traduction" (section 39) et
  # pour la présence en temps réel. Pas requis pour développer les phases 1-8.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Valeur de développement uniquement — changez-la (ou générez-en une via
    # `openssl rand -hex 24`) pour tout usage réel ; en production, utilisez
    # le mot de passe fourni par le Redis managé plutôt que cette variable.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-glotta-dev-only-change-me}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-glotta-dev-only-change-me}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - glotta_redis_data:/data
    networks:
      - glotta_internal

networks:
  # Réseau interne nommé explicitement : les deux services se joignent l'un
  # l'autre par nom de service sans dépendre du réseau par défaut de Compose
  # (nom généré, moins prévisible d'un poste à l'autre).
  glotta_internal:

volumes:
  glotta_postgres_data:
  glotta_redis_data:
